controller_manager:
  ros__parameters:
    use_sim_time: True
    update_rate: 250  # Hz

    joint_states_controller:
      type: joint_state_broadcaster/JointStateBroadcaster

    joint_group_effort_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController


joint_group_effort_controller:
  ros__parameters:
    use_sim_time: True
    joints:
        - FL_hip_joint
        - FL_thigh_joint
        - FL_calf_joint
        - FR_hip_joint
        - FR_thigh_joint
        - FR_calf_joint
        - RL_hip_joint
        - RL_thigh_joint
        - RL_calf_joint
        - RR_hip_joint
        - RR_thigh_joint
        - RR_calf_joint 
    
    
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity

arm_controller:
  ros__parameters:
    use_sim_time: True
    joints:
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5
        - joint6
        - jointGripper
   
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    
    gains:
      FL_hip_joint        : {p: 100.0, i: 0.0, d: 5.0}
      FL_thigh_joint      : {p: 300.0, i: 0.0, d: 8.0}
      FL_calf_joint       : {p: 300.0, i: 0.0, d: 8.0}
      FR_hip_joint        : {p: 100.0, i: 0.0, d: 5.0}
      FR_thigh_joint      : {p: 300.0, i: 0.0, d: 8.0}
      FR_calf_joint       : {p: 300.0, i: 0.0, d: 8.0}
      RL_hip_joint        : {p: 100.0, i: 0.0, d: 5.0}
      RL_thigh_joint      : {p: 300.0, i: 0.0, d: 8.0}
      RL_calf_joint       : {p: 300.0, i: 0.0, d: 8.0}
      RR_hip_joint        : {p: 100.0, i: 0.0, d: 5.0}
      RR_thigh_joint      : {p: 300.0, i: 0.0, d: 8.0}
      RR_calf_joint       : {p: 300.0, i: 0.0, d: 8.0}
      joint1              : {p: 300.0, i: 0.0, d: 5.0}
      joint2              : {p: 300.0, i: 0.0, d: 5.0}
      joint3              : {p: 300.0, i: 0.0, d: 5.0}
      joint4              : {p: 300.0, i: 0.0, d: 5.0}
      joint5              : {p: 300.0, i: 0.0, d: 5.0}
      joint6              : {p: 300.0, i: 0.0, d: 5.0}
      jointGripper        : {p: 300.0, i: 0.0, d: 5.0}
      