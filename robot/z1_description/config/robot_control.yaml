controller_manager:
  ros__parameters:
    use_sim_time: True
    update_rate: 250  # Hz

    joint_states_controller:
      type: joint_state_broadcaster/JointStateBroadcaster

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

arm_controller:
  ros__parameters:
    use_sim_time: True
    joints:
        - joint1
        - joint2
        - joint3
        - joint4
        - joint5
        - joint6
        - jointGripper
   
    command_interfaces:
      - effort
    state_interfaces:
      - position
      - velocity
    
    gains:
      joint1              : {p: 300.0, i: 0.0, d: 5.0}
      joint2              : {p: 300.0, i: 0.0, d: 5.0}
      joint3              : {p: 300.0, i: 0.0, d: 5.0}
      joint4              : {p: 300.0, i: 0.0, d: 5.0}
      joint5              : {p: 300.0, i: 0.0, d: 5.0}
      joint6              : {p: 300.0, i: 0.0, d: 5.0}
      jointGripper        : {p: 300.0, i: 0.0, d: 5.0}
      